# =============================================================================
# CI: build + test bản PC (Linux) và build file APK Android.
# APK được đính kèm ở mục "Artifacts" của mỗi lần chạy workflow; mỗi lần push còn
# cập nhật bản phát hành "latest" (GitHub Releases) với link tải trực tiếp .exe/.apk.
# =============================================================================
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: PC (Linux) + kiểm thử mô phỏng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài thư viện X11/OpenGL cho raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Cấu hình CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Kiểm thử kịch bản (sói → bộ tộc, người → làng)
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-linux
          path: |
            build/worldbox
            build/worldbox_sim

  windows:
    name: Windows (MSVC) + kiểm thử mô phỏng
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình CMake (Visual Studio)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Kiểm thử kịch bản
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-windows
          path: |
            build/Release/worldbox.exe
            build/Release/worldbox_sim.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (NDK có sẵn trên runner)
        run: |
          NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "Dùng NDK $NDK_VER"
          gradle -p android assembleRelease -PndkVersion="$NDK_VER" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: Phát hành bản tải về (GitHub Releases)
    needs: [desktop, windows, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Tạo/cập nhật bản phát hành "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp "$(find dist/worldbox-windows -name worldbox.exe)" out/WorldBoxAI-windows.exe
          cp "$(find dist/worldbox-android-apk -name '*.apk' | head -n1)" out/WorldBoxAI-android.apk
          cat > notes.md <<NOTES
          Build tự động từ commit ${GITHUB_SHA::7} (nhánh ${GITHUB_REF_NAME}).

          * **WorldBoxAI-windows.exe** — Windows 10/11 64-bit, chạy trực tiếp, không cần cài.
          * **WorldBoxAI-android.apk** — Android 7.0+; cho phép "Cài ứng dụng không rõ nguồn gốc" rồi mở file để cài.
          NOTES
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WorldBox AI — bản mới nhất" --notes-file notes.md
