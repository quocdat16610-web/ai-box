# =============================================================================
# CI: build + test bản PC (Linux) và build file APK Android.
# APK được đính kèm ở mục "Artifacts" của mỗi lần chạy workflow.
# =============================================================================
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: PC (Linux) + kiểm thử mô phỏng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài thư viện X11/OpenGL cho raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Cấu hình CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Kiểm thử kịch bản (sói → bộ tộc, người → làng)
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-linux
          path: |
            build/worldbox
            build/worldbox_sim

  windows:
    name: Windows (MSVC) + kiểm thử mô phỏng
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình CMake (Visual Studio)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Kiểm thử kịch bản
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-windows
          path: |
            build/Release/worldbox.exe
            build/Release/worldbox_sim.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (NDK có sẵn trên runner)
        run: |
          NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "Dùng NDK $NDK_VER"
          gradle -p android assembleRelease -PndkVersion="$NDK_VER" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: worldbox-android-apk
          path: android/app/build/outputs/apk/release/*.apk
